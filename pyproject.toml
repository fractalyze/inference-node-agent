[project]
name = "inference-node-agent"
version = "0.1.0"
description = "Metrics collectors for a GPU node serving SGLang: Alloy config and compose files that push engine, GPU and host metrics to Fractalyze"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
    "absl-py>=2.1",
    # The client SGLang ships: tests/test_push.py serves the engine fixture
    # through it, so its Accept-header negotiation is the real one.
    "prometheus-client==0.26.0",
    "pytest>=8",
    "pyyaml>=6",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
